@if (isOpen()) {
  <div class="notif-overlay" (click)="toggle()"></div>
  <div class="notif-panel">
    <div class="notif-header">
      <div class="notif-header-title">
        <span class="notif-icon"><span class="material-symbols-outlined">notifications</span></span>
        <div>
          <h3>Notifications</h3>
          <span class="notif-sub">{{ unreadCount }} unread</span>
        </div>
      </div>
      <div class="notif-actions">
        <button class="btn-mark-read" (click)="markAllRead()" title="Mark all read">
          <span class="material-symbols-outlined">done_all</span>
        </button>
        <button class="btn-close" (click)="toggle()">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </div>

    <div class="notif-list">
      @for (n of (notif.notifications$ | async) ?? []; track $index) {
        <div class="notif-item" [class.critical]="n.type==='critical'" [class.warning]="n.type==='warning'" [class.info]="n.type==='info'">
          <div class="notif-item-title">{{ n.title }}</div>
          <div class="notif-item-sub">{{ n.employee }} · {{ n.time }}</div>
        </div>
      } @empty {
        <div class="notif-empty">
          <span class="material-symbols-outlined">check_circle</span>
          <p>You're all caught up</p>
        </div>
      }
    </div>

    <div class="notif-footer">
      <button class="view-all-btn" (click)="toggle()">
        <span class="material-symbols-outlined">list</span> View all activity
      </button>
    </div>
  </div>
}
